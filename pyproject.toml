[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alharis-alsahabi"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Arabic SRE advisor engine."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alharis-alsahabi = "alharis_alsahabi.cli:main"

[tool.setuptools]
packages = ["alharis_alsahabi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
